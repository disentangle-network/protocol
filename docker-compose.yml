services:
  # Bootstrap node (genesis creator)
  node-0:
    image: ghcr.io/disentangle-network/disentangle-node:v0.4.0
    container_name: disentangle-node-0
    command: ["9000", "8000"]
    ports:
      - "8000:8000"  # RPC
      - "9000:9000"  # P2P
    networks:
      - disentangle
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Follower node 1
  node-1:
    image: ghcr.io/disentangle-network/disentangle-node:v0.4.0
    container_name: disentangle-node-1
    command: ["9000", "8000", "/dns4/node-0/tcp/9000"]
    ports:
      - "8001:8000"  # RPC
      - "9001:9000"  # P2P
    depends_on:
      node-0:
        condition: service_healthy
    networks:
      - disentangle
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Follower node 2
  node-2:
    image: ghcr.io/disentangle-network/disentangle-node:v0.4.0
    container_name: disentangle-node-2
    command: ["9000", "8000", "/dns4/node-0/tcp/9000"]
    ports:
      - "8002:8000"  # RPC
      - "9002:9000"  # P2P
    depends_on:
      node-0:
        condition: service_healthy
    networks:
      - disentangle
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  disentangle:
    driver: bridge

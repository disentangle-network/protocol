services:
  # Genesis/bootstrap node
  node1:
    build: .
    container_name: disentangle-node1
    command: ["9000", "8000"]
    ports:
      - "8001:8000"  # RPC port (HTTP)
      - "9001:9000"  # P2P port
    networks:
      - disentangle
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Follower node 2
  node2:
    build: .
    container_name: disentangle-node2
    command: ["9000", "8000", "/dns4/node1/tcp/9000"]
    ports:
      - "8002:8000"
      - "9002:9000"
    depends_on:
      node1:
        condition: service_healthy
    networks:
      - disentangle
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Follower node 3
  node3:
    build: .
    container_name: disentangle-node3
    command: ["9000", "8000", "/dns4/node1/tcp/9000"]
    ports:
      - "8003:8000"
      - "9003:9000"
    depends_on:
      node1:
        condition: service_healthy
    networks:
      - disentangle
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Follower node 4
  node4:
    build: .
    container_name: disentangle-node4
    command: ["9000", "8000", "/dns4/node1/tcp/9000"]
    ports:
      - "8004:8000"
      - "9004:9000"
    depends_on:
      node1:
        condition: service_healthy
    networks:
      - disentangle
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Follower node 5
  node5:
    build: .
    container_name: disentangle-node5
    command: ["9000", "8000", "/dns4/node1/tcp/9000"]
    ports:
      - "8005:8000"
      - "9005:9000"
    depends_on:
      node1:
        condition: service_healthy
    networks:
      - disentangle
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  disentangle:
    driver: bridge

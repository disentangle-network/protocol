[package]
name = "disentangle-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Entangle network node v0.2"

[dependencies]
disentangle-crypto = { path = "../disentangle-crypto" }
disentangle-simhash = { path = "../disentangle-simhash" }
disentangle-dag = { path = "../disentangle-dag" }
disentangle-consensus = { path = "../disentangle-consensus" }
disentangle-identity = { path = "../disentangle-identity" }
sha3.workspace = true
thiserror.workspace = true
serde.workspace = true
hex.workspace = true
bincode.workspace = true
axum = "0.7"
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

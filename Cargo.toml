[workspace]
resolver = "2"
members = [
    "disentangle-simhash",
    "disentangle-dag",
    "disentangle-consensus",
    "disentangle-node",
    "disentangle-p2p",
    "disentangle-crypto",
    "disentangle-zkp",
    "disentangle-identity",
    "disentangle-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Disentangle Network Contributors"]
license = "Apache-2.0"
repository = "https://github.com/disentangle-network/protocol"
homepage = "https://github.com/disentangle-network"
description = "Proof of Entanglement - A post-quantum topological consensus protocol"

[workspace.dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }

# === POST-QUANTUM CRYPTOGRAPHIC SUITE (v0.2) ===
# Signatures: NIST ML-DSA (Dilithium) Level 5
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"

# Key Encapsulation: NIST ML-KEM (Kyber) Level 5  
pqcrypto-kyber = "0.8"

# Hashing: SHA3-256 (NIST, quantum collision resistant)
sha3 = "0.10"

# Legacy (classical fallback)
sha2 = "0.10"
ed25519-dalek = "2.0"

# Randomness
rand = "0.8"
rand_core = "0.6"

# Serialization
bincode = "1.3"
hex = "0.4"
